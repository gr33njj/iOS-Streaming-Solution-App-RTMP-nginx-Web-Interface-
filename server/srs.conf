# SRS Configuration for iPhone 15 Pro Max Streaming
# Optimized for low latency and high quality

listen              1935;
max_connections     1000;
srs_log_tank        file;
srs_log_level       info;
srs_log_file        ./objs/srs.log;

# HTTP API для управления
http_api {
    enabled         on;
    listen          8080;
    crossdomain     on;
}

# HTTP Server для FLV
http_server {
    enabled         on;
    listen          8000;
    dir             ./objs/nginx/html;
    crossdomain     on;
}

# Статистика
stats {
    network         0;
    disk            sda vda xvda xvdb;
}

# RTMP сервер
vhost __defaultVhost__ {
    # Включаем TCP nodelay для минимальной задержки
    tcp_nodelay     on;
    min_latency     on;
    
    # RTMP настройки
    rtmp {
        enabled     on;
        drop_for_pt 9000;
    }
    
    # HTTP-FLV для live просмотра
    http_flv {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }
    
    # HLS (опционально, для совместимости)
    hls {
        enabled     on;
        hls_fragment 2;
        hls_window  10;
        hls_path    ./objs/nginx/html/[app]/;
        hls_m3u8_file [stream].m3u8;
        hls_ts_file [stream]-[seq].ts;
    }
    
    # DVR в формате CMAF/fMP4
    dvr {
        enabled     on;
        dvr_path    ./objs/nginx/html/dvr/[app]/[stream]/[2006]/[01]/[02]/[15]/[04]/[05].mp4;
        dvr_plan    segment;
        dvr_duration 1;        # 1 секундные сегменты
        dvr_wait_keyframe on;
        
        # Настройки для CMAF
        dvr_apply   all;
        time_jitter full;
    }
    
    # Настройки для iPhone 15 Pro Max
    refer {
        enabled     off;
    }
    
    # Настройки кодеков
    transcode {
        enabled     off;  # Отключаем транскодирование для минимальной задержки
    }
    
    # Настройки буферизации
    play {
        gop_cache       on;     # Кэшируем GOP для быстрого старта
        queue_length    10;     # Минимальная очередь
        mw_latency      100;    # 100ms задержка
    }
    
    # Публикация потока
    publish {
        mr          off;        # Отключаем MR для live
        mr_latency  350;
        firstpkt_timeout 20000;
        normal_timeout   5000;
    }
}
