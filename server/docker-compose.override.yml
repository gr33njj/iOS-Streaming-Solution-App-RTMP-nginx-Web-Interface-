# Development/Production overrides
# This file is automatically loaded by docker-compose

version: '3.8'

services:
  srs:
    environment:
      - SRS_VHOST_HTTP_HOOKS_ON_PUBLISH_URL=http://auth_service:3000/api/hooks/publish
      - SRS_VHOST_HTTP_HOOKS_ON_UNPUBLISH_URL=http://auth_service:3000/api/hooks/unpublish
      - SRS_VHOST_HTTP_HOOKS_ON_PLAY_URL=http://auth_service:3000/api/hooks/play
    volumes:
      - ./ssl:/usr/local/srs/conf/ssl:ro

  nginx:
    environment:
      - NGINX_HOST=your-domain.com
      - NGINX_PORT=443
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.streaming.rule=Host(`your-domain.com`)"
      - "traefik.http.routers.streaming.tls=true"
      - "traefik.http.routers.streaming.tls.certresolver=letsencrypt"

  auth_service:
    environment:
      - DEBUG=auth:*
      - LOG_LEVEL=info
    volumes:
      - ./auth-service/config:/app/config:ro

  dvr_cleaner:
    environment:
      - DEBUG=dvr:*
      - LOG_LEVEL=info
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

